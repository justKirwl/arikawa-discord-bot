services:
  roomd:
    build: .
    image: roomd:dev
    restart: unless-stopped
    environment:
      ROOMD_GRPC_ADDR: 0.0.0.0:50051
      ROOMD_HTTP_ADDR: 0.0.0.0:8080
      ROOMD_LOG_FORMAT: json
      # Development key pair; see examples/dev_token.rs.
      ROOMD_JWT_PUBLIC_KEY: ${ROOMD_JWT_PUBLIC_KEY:-6kpsY-KcUgq-9VB7Ey7F-ZVHdq6-vnuSQh7qaRRG0iw}
      ROOMD_JWT_ISSUER: ${ROOMD_JWT_ISSUER:-cinema-bot}
      ROOMD_JWT_KEY_ID: ${ROOMD_JWT_KEY_ID:-dev-2026-11}
    ports:
      - "50051:50051"
      - "8080:8080"
