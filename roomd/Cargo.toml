[package]
name = "roomd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Realtime playback-room service for the cinema bot: room state, sync and WebSocket fan-out"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.8"
dashmap = "6"
dotenvy = "0.15"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.29", features = ["v7"] }

[build-dependencies]
protoc-bin-vendored = "3.3"
tonic-prost-build = "0.14"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = "symbols"
